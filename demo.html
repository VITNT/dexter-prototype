<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amazing Project</title>
  <style>
    button {
      margin-top: 20px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Camera Test</h1>

  <video id="videoEl" autoplay playsinline muted webkit-playsinline></video>
  <button id="camBtn" onclick="startCamera()">Start Camera</button>
  <button id="flipBtn" onclick="">Flip Camera</button>

  <script>
    let stream;
    let videoElement = document.getElementById('videoEl');
    let btn = document.getElementById('camBtn');
    let flip = document.getElementById('flipBtn');
    let currentCamera = "user";

    async function startCamera() {
      try {
        if (stream) {
          stopCamera();
        }
        stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode: currentCamera}});
        videoElement.srcObject = stream;
        await videoElement.play();
        flip.onclick = flipCamera;
        btn.textContent = "Pause Video";
        btn.onclick = pauseCamera;
      } catch (err) {
        console.error(err);
        alert("Unable to access camera!");
      }
    }
    function pauseCamera() {
      videoElement.pause();
      btn.textContent = "Resume Video";
      btn.onclick = startCamera;
    }
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }
    async function flipCamera() {
      currentCamera = currentCamera === "user" ? "environment" : "user";
      stopCamera();
      await startCamera();
    }
  </script>

</body>
</html>
