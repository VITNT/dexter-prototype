<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dexter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.1.0/dist/fingerpose.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
  </head>

  <body>
    <header class="dex-header">
      <div
        class="dex-logo"
        style="display: flex; align-items: center; gap: 8px"
      >
        <img
          src="logo.png"
          alt="Dexter Logo"
          width="64"
          height="64"
          style="border-radius: 6px"
        />
        <span class="dex-blue">Dexter</span>
      </div>
      <nav class="dex-nav">
        <a href="index.html" class="dex-nav-item active">Translate</a>
        <div class="dex-nav-dropdown">
          <button class="dex-nav-item">Learn ▼</button>
          <div class="dex-nav-dropdown-content">
            <a href="learn.html?lang=asl" class="dex-nav-dropdown-item"
              >ASL Dictionary</a
            >
            <a href="learn.html?lang=csl" class="dex-nav-dropdown-item"
              >CSL Dictionary</a
            >
          </div>
        </div>
      </nav>
      <button
        id="darkModeToggle"
        class="theme-toggle-btn"
        title="Toggle Dark Mode"
      >
        <svg
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24px"
          height="24px"
        >
          <path
            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"
          ></path>
        </svg>
      </button>
    </header>

    <main class="dex-main">
      <div class="dex-card-container">
        <div class="dex-box">
          <div class="dex-box-header">
            <div class="custom-dropdown" id="modeDropdown">
              <button
                class="dex-lang-tab active custom-dropdown-btn"
                onclick="window.toggleDropdown()"
              >
                <span id="currentModeLabel">ASL Spelling</span>
                <svg
                  focusable="false"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="18px"
                  height="18px"
                  style="
                    margin-left: 4px;
                    pointer-events: none;
                    vertical-align: middle;
                  "
                >
                  <path d="M7 10l5 5 5-5z"></path>
                </svg>
              </button>
              <div class="custom-dropdown-content" id="modeMenu">
                <div
                  class="dropdown-item active"
                  onclick="
                    window.selectMode('asl_letter', 'ASL Spelling', this)
                  "
                >
                  ASL Spelling
                </div>
                <div
                  class="dropdown-item"
                  onclick="window.selectMode('asl_word', 'ASL Words', this)"
                >
                  ASL Words
                </div>
                <div
                  class="dropdown-item"
                  onclick="window.selectMode('csl_word', 'CSL Words', this)"
                >
                  CSL Words
                </div>
              </div>
            </div>
          </div>
          <div class="dex-box-content">
            <div class="video-container">
              <video
                id="webcamFeed"
                autoplay
                playsinline
                muted
                webkit-playsinline
              ></video>
              <canvas class="overlayCanvas"></canvas>
            </div>

            <div class="debug-panel">
              <div class="debug-text">
                Top Guess: <span id="guessLabel">None</span> (<span
                  id="confidencePct"
                  >0%</span
                >)
              </div>
              <div class="bar-container">
                <div id="confidenceBar"></div>
              </div>
            </div>
          </div>
          <div class="dex-box-footer">
            <div class="dex-controls-left">
              <button
                id="cameraBtn"
                class="dex-btn-primary"
                onclick="window.startCam()"
              >
                Start Camera
              </button>
              <button
                id="pauseBtn"
                class="dex-btn-primary"
                onclick="window.pauseCam()"
                style="display: none; margin-left: 8px"
              >
                Pause Camera
              </button>
              <button
                class="dex-icon-btn"
                onclick="window.flipCam()"
                title="Flip Camera"
              >
                <svg
                  focusable="false"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="#5f6368"
                  width="24px"
                  height="24px"
                >
                  <path
                    d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="dex-box output-box">
          <div class="dex-box-header">
            <div class="dex-lang-tab active" id="outputLangLabel">English</div>
            <button
              class="dex-icon-btn clear-btn"
              onclick="clearWord()"
              title="Clear translation"
            >
              <svg
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="#5f6368"
                width="24px"
                height="24px"
              >
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"
                ></path>
              </svg>
            </button>
          </div>
          <div class="dex-box-content dex-output-content">
            <div class="translation-wrapper">
              <div id="liveOutput" class="live-translation">...</div>
              <div class="word-panel">
                <div id="builtSentence" class="extracted-word"></div>
                <div id="translatedResult" class="final-translation"></div>
              </div>
            </div>
          </div>
          <div class="dex-box-footer output-footer">
            <button onclick="translateSentence()" class="dex-btn-translate">
              Interpret Context
            </button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
