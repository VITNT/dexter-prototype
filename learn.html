<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dexter</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="dex-header">
    <div class="dex-logo" style="display: flex; align-items: center; gap: 8px;">
      <img src="logo.png" alt="Dexter Logo" width="32" height="32" style="border-radius: 6px;">
      <span class="dex-blue">Dexter</span>
    </div>
    <nav class="dex-nav">
      <a href="index.html" class="dex-nav-item">Translate</a>
      <div class="dex-nav-dropdown">
        <span class="dex-nav-item active">Learn ▼</span>
        <div class="dex-nav-dropdown-content">
          <a href="learn.html?lang=asl" class="dex-nav-dropdown-item">ASL Dictionary</a>
          <a href="learn.html?lang=csl" class="dex-nav-dropdown-item">CSL Dictionary</a>
        </div>
      </div>
    </nav>
    <button id="darkModeToggle" class="theme-toggle-btn" title="Toggle Dark Mode">
      <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px">
        <path
          d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z">
        </path>
      </svg>
    </button>
  </header>

  <main class="dex-main">
    <div class="dictionary-container">
      <div class="dictionary-header">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h1 class="dictionary-title" id="dictTitle">Sign Language Dictionary</h1>
          <label class="flashcard-switch-wrapper">
            <div class="custom-switch">
              <input type="checkbox" id="flashcardToggle" checked onchange="toggleFlashcardMode()">
              <span class="slider"></span>
            </div>
            Flashcard Mode
          </label>
        </div>
        <div class="dictionary-tabs">
          <button class="dict-tab active" id="tab-asl" onclick="switchLanguage('asl')">ASL</button>
          <button class="dict-tab" id="tab-csl" onclick="switchLanguage('csl')">CSL</button>
        </div>
      </div>

      <div class="dictionary-grid flashcard-active" id="dictGrid">
        <!-- Cards will be populated here by learn.js -->
      </div>
    </div>
  </main>

  <script src="learn.js"></script>
  <script>
    // Keep dark mode logic consistent across pages
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }
    document.getElementById('darkModeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    });
  </script>
</body>

</html>
