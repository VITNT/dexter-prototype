<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASL Recording Studio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0d0d0d;
        color: white;
        text-align: center;
        font-family: "Manrope", sans-serif;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.6rem;
      }

      button {
        margin-top: 10px;
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-family: "Manrope", sans-serif;
        font-weight: 600;
        transition: opacity 0.15s;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .collector-ui {
        margin: 16px auto;
        padding: 18px 24px;
        border: 2px dashed #39ff14;
        display: inline-block;
        border-radius: 10px;
        background: #111;
        min-width: 320px;
      }
      .collector-ui h3 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        color: #39ff14;
      }

      input[type="text"],
      input[type="number"] {
        padding: 8px 12px;
        font-size: 15px;
        background: #1e1e1e;
        color: white;
        border: 1px solid #444;
        border-radius: 5px;
        font-family: "Manrope", sans-serif;
      }
      input[type="text"] {
        width: 160px;
      }
      input[type="number"] {
        width: 54px;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      #recordBtn {
        background: #e91e63;
        color: white;
      }
      #recordBtn:hover:not(:disabled) {
        background: #c2185b;
      }

      #burstBtn {
        background: #9c27b0;
        color: white;
      }
      #burstBtn:hover:not(:disabled) {
        background: #7b1fa2;
      }

      .ctrl-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ctrl-label {
        font-size: 13px;
        color: #aaa;
      }

      #qualityIndicator {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #recordStatus {
        margin-top: 10px;
        color: yellow;
        font-size: 15px;
        min-height: 22px;
      }
    </style>
  </head>
  <body>
    <h1>🎬 Recording Studio</h1>

    <div
      style="
        position: relative;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 4/3;
        margin: 0 auto;
      "
    >
      <video
        id="videoEl"
        autoplay
        playsinline
        muted
        webkit-playsinline
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        "
      ></video>
      <canvas
        class="canvasEl"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 10;
          pointer-events: none;
        "
      ></canvas>

      <div
        id="countdownOverlay"
        style="
          display: none;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-size: 150px;
          font-weight: bold;
          color: white;
          text-shadow: 4px 4px 20px black;
          z-index: 20;
        "
      >
        3
      </div>
    </div>

    <!-- Camera Controls -->
    <div class="btn-row" style="margin-top: 12px">
      <button
        id="camBtn"
        onclick="window.startCamera()"
        style="background: #4caf50; color: white"
      >
        ▶ Start Camera
      </button>
      <button
        id="flipBtn"
        onclick="window.flipCamera()"
        style="background: #607d8b; color: white"
      >
        ⟳ Flip Camera
      </button>
      <button
        id="modeBtn"
        onclick="window.toggleMode()"
        style="background-color: #ff9800; color: black"
      >
        Mode: Hands Only
      </button>
    </div>

    <!-- Dataset Recorder Panel -->
    <div class="collector-ui">
      <h3>📼 Dataset Recorder</h3>

      <div class="ctrl-row">
        <label class="ctrl-label" for="gestureName">Label:</label>
        <input type="text" id="gestureName" placeholder="e.g., hello" />
      </div>

      <div class="ctrl-row" style="margin-top: 8px">
        <label class="ctrl-label" for="timerDelay">Delay (s):</label>
        <input
          type="number"
          id="timerDelay"
          value="3"
          min="0"
          max="10"
          title="Countdown before recording starts"
        />

        <label class="ctrl-label" for="burstCount">Burst N:</label>
        <input
          type="number"
          id="burstCount"
          value="5"
          min="1"
          max="20"
          title="Number of samples in burst mode"
        />
      </div>

      <div class="btn-row">
        <button id="recordBtn" onclick="window.recordGesture()">
          🔴 Record 1 Sample
        </button>
        <button id="burstBtn" onclick="window.recordBurst()">
          ⚡ Burst Record
        </button>
      </div>

      <!-- Live sub-model routing indicator -->
      <div
        id="routingIndicator"
        style="
          margin-top: 12px;
          padding: 8px 14px;
          background: #1a1a1a;
          border: 1px solid #00bcd4;
          border-radius: 6px;
          font-size: 13px;
          letter-spacing: 0.03em;
          color: #aaa;
        "
      >
        Routing Bucket:&nbsp;
        <span
          id="routingVote"
          style="color: cyan; font-weight: bold; font-size: 14px"
        >
          Determining...
        </span>
      </div>

      <!-- Quality indicator (updated live by recorder.js) -->
      <div id="qualityIndicator">Quality: --</div>

      <p id="recordStatus">Ready to record...</p>
    </div>

    <script type="module" src="recorder.js"></script>
  </body>
</html>
