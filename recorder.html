<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ASL Recording Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
        }

        button {
            margin-top: 10px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .capture-panel {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed lime;
            display: inline-block;

        input {
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
                <title>ASL Recording Studio</title>
                <link rel="preconnect" href="https://fonts.googleapis.com">
                <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
                <link rel="stylesheet" href="styles.css">
                <style>
                    body {
                        background: #f8f9fa;
                        font-family: 'Manrope', sans-serif;
                    }

                    .record-shell {
                        max-width: 1120px;
                        margin: 0 auto;
                        width: 100%;
                        padding: 24px 16px 40px;
                        box-sizing: border-box;
                    }

                    .record-panel {
                        background: #fff;
                        border: 1px solid #dadce0;
                        border-radius: 12px;
                        box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.1), 0 4px 8px 3px rgba(60, 64, 67, 0.05);
                        padding: 20px;
                    }

                    .record-grid {
                        display: grid;
                        gap: 16px;
                    }

                    .record-video-wrap {
                        position: relative;
                        width: 100%;
                        max-width: 760px;
                        aspect-ratio: 4 / 3;
                        margin: 0 auto;
                        border-radius: 10px;
                        overflow: hidden;
                        background: #000;
                    }

                    .record-video-wrap video,
                    .record-video-wrap canvas {
                        position: absolute;
                        inset: 0;
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                    }

                    .record-video-wrap canvas {
                        z-index: 10;
                        pointer-events: none;
                    }

                    .record-controls,
                    .record-actions {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 10px;
                        justify-content: center;
                        align-items: center;
                    }

                    .record-card {
                        border: 1px solid #dadce0;
                        border-radius: 12px;
                        padding: 16px;
                        background: #f8f9fa;
                    }

                    .record-field {
                        display: flex;
                        gap: 10px;
                        align-items: center;
                        justify-content: center;
                        flex-wrap: wrap;
                    }

                    .record-field label {
                        color: #5f6368;
                        font-size: 14px;
                        font-weight: 600;
                    }

                    .record-field input {
                        padding: 10px 12px;
                        border-radius: 8px;
                        border: 1px solid #dadce0;
                        font: inherit;
                        min-width: 150px;
                    }

                    .record-status {
                        margin-top: 12px;
                        color: #5f6368;
                        min-height: 24px;
                        text-align: center;
                    }

                    .record-meta {
                        display: grid;
                        gap: 10px;
                        margin-top: 14px;
                        color: #5f6368;
                        font-size: 14px;
                    }

                    .record-routing {
                        padding: 10px 12px;
                        border-radius: 10px;
                        border: 1px solid rgba(26, 115, 232, 0.18);
                        background: rgba(26, 115, 232, 0.05);
                    }

                    @media screen and (max-width: 800px) {
                        .record-shell {
                            padding: 12px 8px 24px;
                        }

                        .record-panel {
                            padding: 14px;
                        }
                    }
                </style>
            </head>
            <body>
                <header class="dex-header">
                    <div class="dex-logo" style="display: flex; align-items: center; gap: 8px;">
                        <img src="logo.png" alt="Dexter Logo" width="32" height="32" style="border-radius: 6px;">
                        <span class="dex-blue">Dexter</span>
                    </div>
                    <nav class="dex-nav">
                        <a href="index.html" class="dex-nav-item">Translate</a>
                        <a href="learn.html" class="dex-nav-item">Learn</a>
                        <a href="recorder.html" class="dex-nav-item active">Recorder</a>
                        <a href="trainer.html" class="dex-nav-item">Trainer</a>
                    </nav>
                    <button id="darkModeToggle" class="theme-toggle-btn" title="Toggle Dark Mode">
                        <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px">
                            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"></path>
                        </svg>
                    </button>
                </header>

                <main class="dex-main">
                    <div class="record-shell">
                        <div class="record-panel">
                            <div class="record-grid">
                                <div class="record-video-wrap">
                                    <video id="webcamFeed" autoplay playsinline muted webkit-playsinline></video>
                                    <canvas class="overlayCanvas"></canvas>
                                    <div id="countdownOverlay" style="display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-size:150px; font-weight:700; color:white; text-shadow:4px 4px 20px black; z-index:20;">3</div>
                                </div>

                                <div class="record-controls">
                                    <button id="cameraToggleBtn" onclick="window.startCamera()" class="dex-btn-primary">Start Camera</button>
                                    <button id="flipCameraBtn" onclick="window.flipCamera()" class="dex-btn-primary">Flip Camera</button>
                                    <button id="trackingModeBtn" onclick="window.toggleMode()" class="dex-btn-translate">Mode: Hands Only</button>
                                </div>

                                <div class="record-card">
                                    <div class="record-field">
                                        <label for="signLabel">Label:</label>
                                        <input type="text" id="signLabel" placeholder="e.g., hello" />
                                    </div>

                                    <div class="record-field" style="margin-top: 12px;">
                                        <label for="timerDelay">Delay (s):</label>
                                        <input type="number" id="timerDelay" value="3" min="0" max="10" title="Countdown before recording starts" />
                                        <label for="burstCount">Burst N:</label>
                                        <input type="number" id="burstCount" value="5" min="1" max="20" title="Number of samples in burst mode" />
                                    </div>

                                    <div class="record-actions" style="margin-top: 14px;">
                                        <button id="recordBtn" onclick="window.recordGesture()" class="dex-btn-primary">Record 1 Sample</button>
                                        <button id="burstBtn" onclick="window.recordBurst()" class="dex-btn-primary">Burst Record</button>
                                    </div>

                                    <div class="record-meta">
                                        <div id="routingIndicator" class="record-routing">
                                            Routing Bucket: <span id="routingVote" style="color:#1a73e8; font-weight:700;">Determining...</span>
                                        </div>
                                        <div id="qualityIndicator">Quality: --</div>
                                        <p id="captureStatus" class="record-status">Ready to record...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                <script type="module" src="recorder.js"></script>
                <script>
                    if (localStorage.getItem('darkMode') === 'true') {
                        document.body.classList.add('dark-mode');
                    }
                    document.getElementById('darkModeToggle').addEventListener('click', () => {
                        document.body.classList.toggle('dark-mode');
                        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
                    });
                </script>
            </body>
            </html>
